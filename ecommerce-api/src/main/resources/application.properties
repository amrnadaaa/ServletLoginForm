# Database Configuration
db.url=jdbc:mysql://localhost:3306/ecommerce_db
db.user=root
db.password=password
db.driver=com.mysql.cj.jdbc.Driver

# Redis Configuration
redis.host=localhost
redis.port=6379
redis.timeout=3000

# JWT Configuration
jwt.secret=your_super_secret_key_that_is_at_least_32_characters_long_for_HS256
jwt.expiration=86400000

# Application Configuration
app.name=E-Commerce REST API
app.version=1.0.0
app.cors.allowed.origins=http://localhost:3000,http://localhost:8080

# Rate Limiting
rate.limit.enabled=true
rate.limit.requests=10
rate.limit.window=60

# Logging
logging.level=INFO